<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff3f7">
<title>体重管理 完成形プレビュー</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fff3f7;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#443b45}
body{display:flex;justify-content:center}
.app{width:min(100vw,430px);min-height:100vh;padding:22px 16px 24px;overflow:hidden;background:
radial-gradient(circle at -9% 7%,rgba(247,201,216,.55) 0 95px,transparent 96px),
radial-gradient(circle at 108% 10%,rgba(247,201,216,.43) 0 110px,transparent 111px),
radial-gradient(circle at -4% 103%,rgba(247,201,216,.35) 0 128px,transparent 129px),
linear-gradient(180deg,#fff8fb 0%,#fff0f5 100%)}
.title{text-align:center;color:#ce4776;font-size:31px;font-weight:800;letter-spacing:.03em;margin-top:0}.underline{width:54px;height:5px;border-radius:99px;background:#ea7fa2;margin:8px auto 24px}
.card{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.96);box-shadow:0 8px 22px rgba(201,63,111,.08);border-radius:27px}
.weight{padding:23px 14px 25px;text-align:center}.weight-label{font-size:21px;font-weight:750;margin-bottom:14px}.weight-line{display:flex;align-items:center;justify-content:center;gap:11px}.num{font-size:68px;line-height:1;font-weight:800;color:#d32769;letter-spacing:-.03em}.kg{font-size:28px;font-weight:700;margin-left:4px;color:#443b45}
.rays{width:34px;height:62px;position:relative;flex:0 0 34px}.rays i{position:absolute;width:21px;height:5px;border-radius:99px;background:#f3a2b9}.rays.left i:nth-child(1){left:7px;top:7px;transform:rotate(38deg)}.rays.left i:nth-child(2){left:0;top:28px}.rays.left i:nth-child(3){left:7px;top:49px;transform:rotate(-38deg)}.rays.right i:nth-child(1){right:7px;top:7px;transform:rotate(-38deg)}.rays.right i:nth-child(2){right:0;top:28px}.rays.right i:nth-child(3){right:7px;top:49px;transform:rotate(38deg)}
.adjust{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.adjust .btn{height:83px;border-radius:26px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:54px;font-weight:300;box-shadow:0 8px 18px rgba(209,70,117,.12)}.minus{background:linear-gradient(135deg,#f6c0d1,#eca7ba)}.plus{background:linear-gradient(135deg,#ee9ab5,#df6b94)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:13px}.mini{min-height:99px;padding:14px 13px;display:flex;align-items:center;gap:11px}.icon{width:52px;height:52px;flex:0 0 52px;border-radius:50%;background:#ffe4ec;display:flex;align-items:center;justify-content:center}.mini .label{font-size:17px;font-weight:750}.mini .value{font-size:30px;line-height:1.05;font-weight:800;color:#d22f6d;margin-top:1px;white-space:nowrap}.mini .value.green{color:#18b481}.mini .unit{font-size:15px;color:#4b4148;margin-left:2px}
.bmi{margin-top:13px;min-height:104px;padding:15px 15px;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}.bmi .label{font-size:17px;font-weight:750}.bmi .value{font-size:40px;line-height:1;font-weight:800;color:#d22f6d}.pill{min-width:112px;padding:13px 16px;border-radius:999px;background:#dff3eb;color:#11a975;font-size:19px;font-weight:800;text-align:center}
.menu{margin-top:13px;display:grid;gap:12px}.menu-row{height:76px;padding:0 15px;display:grid;grid-template-columns:52px 1fr 24px;align-items:center;gap:10px;font-size:19px;font-weight:750}.chev{font-size:35px;color:#dc5a84;font-weight:300;text-align:right}
svg{display:block}
</style>
</head>
<body>
<div class="app">
  <div class="title">体重管理</div><div class="underline"></div>
  <div class="card weight">
    <div class="weight-label">今日の体重</div>
    <div class="weight-line">
      <span class="rays left"><i></i><i></i><i></i></span>
      <div><span class="num">52.3</span><span class="kg">kg</span></div>
      <span class="rays right"><i></i><i></i><i></i></span>
    </div>
  </div>
  <div class="adjust"><div class="btn minus">−</div><div class="btn plus">＋</div></div>
  <div class="pair">
    <div class="card mini">
      <div class="icon">
        <svg width="31" height="31" viewBox="0 0 31 31" aria-hidden="true"><path d="M8 5v22" stroke="#dc5a83" stroke-width="3.4" stroke-linecap="round"/><path d="M10 6.5c6-2.5 9 2 15 0v10c-6 2-9-2.2-15 0z" fill="#ed7197"/></svg>
      </div>
      <div><div class="label">目標</div><div class="value">50.0<span class="unit"> kg</span></div></div>
    </div>
    <div class="card mini">
      <div class="icon">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="4" y="18" width="4" height="8" rx="2" fill="#ef91ad"/><rect x="10" y="14" width="4" height="12" rx="2" fill="#e97b9e"/><rect x="16" y="9" width="4" height="17" rx="2" fill="#e56b92"/><rect x="22" y="4" width="4" height="22" rx="2" fill="#dc5a83"/></svg>
      </div>
      <div><div class="label">前回比</div><div class="value green">-0.2<span class="unit"> kg</span></div></div>
    </div>
  </div>
  <div class="card bmi">
    <div class="icon">
      <svg width="33" height="33" viewBox="0 0 33 33" aria-hidden="true"><path d="M6 23a11 11 0 0 1 22 0" fill="none" stroke="#df5d88" stroke-width="3" stroke-linecap="round"/><path d="M9 19l-2.4-1.3M15 13l-1-2.7M23 14l1.9-2" stroke="#df5d88" stroke-width="2.2" stroke-linecap="round"/><path d="M16.5 23l7-7" stroke="#df5d88" stroke-width="3" stroke-linecap="round"/><circle cx="16.5" cy="23" r="2.6" fill="#df5d88"/></svg>
    </div>
    <div><div class="label">BMI</div><div class="value">22.4</div></div>
    <div class="pill">普通</div>
  </div>
  <div class="menu">
    <div class="card menu-row">
      <div class="icon">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M5 22l7-7 5 4 8-10" fill="none" stroke="#dd5a84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 9h6v6" fill="none" stroke="#dd5a84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>グラフを見る</div><div class="chev">›</div>
    </div>
    <div class="card menu-row">
      <div class="icon">
        <svg width="29" height="29" viewBox="0 0 29 29" aria-hidden="true"><rect x="6" y="3" width="17" height="23" rx="2.5" fill="none" stroke="#dd5a84" stroke-width="3"/><path d="M10 9h9M10 14h9M10 19h7" stroke="#dd5a84" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <div>過去の記録</div><div class="chev">›</div>
    </div>
  </div>
</div>
</body>
</html>
