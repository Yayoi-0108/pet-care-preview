<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff5f8">
<title>体重管理</title>
<style>
:root{--pink:#cf3f70;--pink2:#e56f94;--soft:#fff7fa;--text:#443844;--muted:#8b7e88;--green:#35b98b;--line:#f1e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#fff4f7;color:var(--text)}
body{overflow:hidden}
.app{position:fixed;inset:0;max-width:520px;margin:auto;background:
radial-gradient(circle at -10% 16%,rgba(249,197,213,.34) 0 105px,transparent 106px),
radial-gradient(circle at 105% 18%,rgba(249,197,213,.28) 0 105px,transparent 106px),
radial-gradient(circle at 10% 100%,rgba(249,197,213,.30) 0 120px,transparent 121px),
linear-gradient(180deg,#fff9fb,#fff1f5);overflow:hidden}
header{height:78px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#c64d74;letter-spacing:.03em;position:relative;background:transparent}
header:after{content:"";position:absolute;bottom:9px;width:36px;height:4px;border-radius:10px;background:#ef8cab}
main{position:absolute;top:78px;bottom:72px;left:0;right:0;padding:10px 18px 26px;overflow:auto;-webkit-overflow-scrolling:touch}
.hidden{display:none!important}.screen{min-height:100%}
.card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 10px 28px rgba(208,76,116,.10)}
.weight-card{padding:25px 18px 27px;text-align:center}.eyebrow{font-size:20px;font-weight:700;color:#544954}.weight{font-size:70px;line-height:1;font-weight:800;color:var(--pink);margin-top:18px;font-variant-numeric:tabular-nums}.weight small{font-size:27px;color:#544954;margin-left:6px}
.adjust{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}.adjust button{height:92px;border:0;border-radius:30px;font-size:52px;font-weight:300;color:white;background:linear-gradient(135deg,#f6b3c7,#eb90aa);box-shadow:0 12px 24px rgba(217,79,120,.16)}.adjust button:last-child{background:linear-gradient(135deg,#ec8fad,#df648a)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mini{min-height:114px;padding:17px 15px;display:flex;align-items:center;gap:12px}.icon{width:58px;height:58px;flex:0 0 58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffe8ef;color:#d9557d;font-size:27px}.mini .label{font-size:16px;font-weight:700}.mini .value{font-size:31px;font-weight:800;color:#d34270;margin-top:2px;white-space:nowrap}.mini .value small{font-size:15px;color:#5b4f58}.mini .value.delta-down{color:var(--green)}.mini .value.delta-up{color:#d34270}.mini .value.delta-zero{color:#7e737c}
.bmi-card{margin-top:14px;padding:18px;display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center}.bmi-main .label{font-size:16px;font-weight:700}.bmi-main .value{font-size:39px;line-height:1;font-weight:800;color:#d34270;margin-top:3px}.badge{min-width:112px;text-align:center;padding:13px 16px;border-radius:999px;font-size:17px;font-weight:800;background:#e5f6ef;color:#2aa77d}.badge.low{background:#edf3ff;color:#5d7fb5}.badge.high{background:#fff0f3;color:#d25272}.bmi-note{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-6px}
.menu{margin-top:14px;padding:0 18px}.menu button{width:100%;height:78px;border:0;background:transparent;display:grid;grid-template-columns:58px 1fr auto;align-items:center;text-align:left;border-bottom:1px solid var(--line);font-size:19px;font-weight:700;color:var(--text)}.menu button:last-child{border-bottom:0}.chev{font-size:34px;color:#dc6389}
.bottom{position:absolute;left:0;right:0;bottom:0;height:72px;background:rgba(255,255,255,.95);border-top:1px solid #f0e5e9;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav{border:0;background:none;color:#91848d;font-size:12px}.nav span{display:block;font-size:22px}.nav.active{color:#d44d76;font-weight:800}
.title{font-size:23px;font-weight:800;margin:4px 0 14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tab{border:0;border-radius:13px;padding:11px;background:#f0edf0;color:#756b74;font-weight:700}.tab.active{background:#df6289;color:white}.chart-wrap,.list-card,.settings-card,.edit-card{padding:16px}.chart-wrap svg{width:100%;height:300px;background:white;border-radius:20px}.row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.edit-link{border:0;background:none;color:#d94f79;font-size:22px}.setting{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.smallbtn{width:42px;height:42px;border:0;border-radius:50%;background:#ffe1eb;color:#d94f79;font-size:25px}.setting input,.edit-row input{width:110px;font-size:20px;padding:8px;border:1px solid #eadde2;border-radius:12px;text-align:center}.edit-row{display:flex;justify-content:center;align-items:center;gap:12px;margin:22px 0}.save,.danger{width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:800;margin-top:10px}.save{border:0;background:#d94f79;color:white}.danger{background:white;color:#d94f79;border:1px solid #d94f79}.date{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<header id="head">体重管理</header>
<main>
<section id="home" class="screen">
  <div class="card weight-card">
    <div class="eyebrow">今日の体重</div>
    <div class="weight"><span id="weightHome">52.3</span><small>kg</small></div>
  </div>
  <div class="adjust"><button id="minus">−</button><button id="plus">＋</button></div>
  <div class="info-grid">
    <div class="card mini"><div class="icon">⚑</div><div><div class="label">目標</div><div class="value"><span id="goalHome">50.0</span><small> kg</small></div></div></div>
    <div class="card mini"><div class="icon">▥</div><div><div class="label">前回比</div><div id="previousDelta" class="value delta-zero">--<small> kg</small></div></div></div>
  </div>
  <div class="card bmi-card">
    <div class="icon">◔</div><div class="bmi-main"><div class="label">BMI</div><div id="bmiValue" class="value">--</div></div><div id="bmiRating" class="badge">--</div><div id="bmiNote" class="bmi-note">設定で身長を入力してください</div>
  </div>
  <div class="card menu">
    <button id="openGraph"><span class="icon">↗</span><span>グラフを見る</span><span class="chev">›</span></button>
    <button id="openHistory"><span class="icon">▤</span><span>過去の記録</span><span class="chev">›</span></button>
  </div>
</section>
<section id="graph" class="screen hidden"><div class="title">グラフ</div><div class="tabs"><button class="tab active" data-days="7">1週間</button><button class="tab" data-days="30">1か月</button><button class="tab" data-days="365">1年</button></div><div class="card chart-wrap"><svg id="chart" viewBox="0 0 360 280"></svg></div></section>
<section id="history" class="screen hidden"><div class="title">過去の記録</div><div class="card list-card" id="historyList"></div></section>
<section id="settings" class="screen hidden"><div class="title">設定</div><div class="card settings-card"><div class="setting"><span>目標体重</span><div><button class="smallbtn" id="gminus">−</button><strong style="display:inline-block;min-width:88px;text-align:center"><span id="goalSetting">50.0</span> kg</strong><button class="smallbtn" id="gplus">＋</button></div></div><div class="setting"><span>身長</span><div><input id="heightInput" type="number" min="100" max="250" step="0.1" placeholder="未設定"> cm</div></div></div></section>
<section id="editPage" class="screen hidden"><div class="title">体重の編集</div><div class="card edit-card"><div class="date" id="editDate"></div><div class="edit-row"><button class="smallbtn" id="eminus">−</button><input id="editWeight" type="number" step="0.1"><button class="smallbtn" id="eplus">＋</button></div><button class="save" id="saveEdit">保存</button><button class="danger" id="deleteEdit">この記録を削除</button></div></section>
</main>
<nav class="bottom"><button class="nav active" data-page="home"><span>⌂</span>ホーム</button><button class="nav" data-page="graph"><span>▥</span>グラフ</button><button class="nav" data-page="history"><span>▤</span>記録</button><button class="nav" data-page="settings"><span>⚙︎</span>設定</button></nav>
</div>
<script>
(()=>{const $=id=>document.getElementById(id),KEY='weightAppLive1';const today=new Date();today.setHours(0,0,0,0);const pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),todayKey=key(today);function seed(){const r={},v=[52.9,52.7,52.6,52.5,52.4,52.5,52.3];for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);r[key(d)]=v[6-i]}return{goal:50,records:r,profile:{height:null}}}let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){data=seed()}if(!data.profile||typeof data.profile!=='object')data.profile={height:null};if(!data.records||typeof data.records!=='object')data.records={};if(data.records[todayKey]==null)data.records[todayKey]=52.3;let days=7,editing=null;const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};const w=()=>Number(data.records[todayKey]);function previousValue(){const ks=Object.keys(data.records).filter(k=>k<todayKey&&Number.isFinite(Number(data.records[k]))).sort();return ks.length?Number(data.records[ks[ks.length-1]]):null}function renderPrevious(){const prev=previousValue(),el=$('previousDelta');if(prev==null){el.className='value delta-zero';el.innerHTML='--<small> kg</small>';return}const diff=Math.round((w()-prev)*10)/10,sign=diff>0?'+':'';el.className='value '+(diff<0?'delta-down':diff>0?'delta-up':'delta-zero');el.innerHTML=sign+diff.toFixed(1)+'<small> kg</small>'}function renderBMI(){const h=Number(data.profile.height),weight=w(),value=$('bmiValue'),rating=$('bmiRating'),note=$('bmiNote');if(!Number.isFinite(h)||h<100||h>250){value.textContent='--';rating.textContent='--';rating.className='badge';note.textContent='設定で身長を入力してください';return}const bmi=weight/Math.pow(h/100,2);value.textContent=bmi.toFixed(1);note.textContent='';if(bmi<18.5){rating.textContent='低め';rating.className='badge low'}else if(bmi<25){rating.textContent='普通';rating.className='badge'}else{rating.textContent='高め';rating.className='badge high'}}function home(){$('weightHome').textContent=w().toFixed(1);$('goalHome').textContent=Number(data.goal).toFixed(1);$('goalSetting').textContent=Number(data.goal).toFixed(1);$('heightInput').value=data.profile.height??'';renderPrevious();renderBMI()}function change(step){data.records[todayKey]=Math.max(20,Math.min(300,Math.round((w()+step)*10)/10));persist();home();hist();draw()}function page(p){['home','graph','history','settings','editPage'].forEach(id=>$(id).classList.toggle('hidden',id!==p));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('head').textContent=p==='home'?'体重管理':p==='graph'?'グラフ':p==='history'?'記録':p==='settings'?'設定':'体重の編集';if(p==='graph')draw();if(p==='history')hist()}function hist(){const ks=Object.keys(data.records).sort().reverse();$('historyList').innerHTML=ks.map(k=>{const d=new Date(k+'T00:00:00');return '<div class="row"><span>'+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日</span><span><strong>'+Number(data.records[k]).toFixed(1)+' kg</strong> <button class="edit-link" data-k="'+k+'">›</button></span></div>'}).join('')||'<div style="padding:10px;text-align:center;color:#877985">記録がありません</div>';document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>openEdit(b.dataset.k))}function openEdit(k){editing=k;const d=new Date(k+'T00:00:00');$('editDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';$('editWeight').value=Number(data.records[k]).toFixed(1);page('editPage')}function draw(){const cutoff=new Date(today);cutoff.setDate(cutoff.getDate()-(days-1));const pts=Object.entries(data.records).map(([k,v])=>({d:new Date(k+'T00:00:00'),v:Number(v)})).filter(p=>p.d>=cutoff&&p.d<=today&&Number.isFinite(p.v)).sort((a,b)=>a.d-b.d),svg=$('chart');if(!pts.length){svg.innerHTML='<text x="180" y="140" text-anchor="middle" fill="#877985">記録がありません</text>';return}const W=360,H=280,L=42,R=18,T=24,B=42,vals=pts.map(p=>p.v).concat([Number(data.goal)]);let mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);if(mx-mn<4)mx=mn+4;const x=i=>L+(W-L-R)*(pts.length===1?.5:i/(pts.length-1)),y=v=>T+(H-T-B)*(mx-v)/(mx-mn);let s='';for(let n=mn;n<=mx;n++){const yy=y(n);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#f0edf0"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#9a8d96">'+n+'</text>'}const gy=y(Number(data.goal));s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="#d94f79" stroke-dasharray="6 5"/>';s+='<path d="'+pts.map((p,i)=>(i?'L':'M')+' '+x(i)+' '+y(p.v)).join(' ')+'" fill="none" stroke="#e36e93" stroke-width="3"/>';pts.forEach((p,i)=>s+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="4" fill="#d94f79"/>');svg.innerHTML=s}function holdButton(id,step){const btn=$(id);let t=null,i=null;const stop=()=>{clearTimeout(t);clearInterval(i);t=i=null};btn.addEventListener('pointerdown',e=>{e.preventDefault();change(step);t=setTimeout(()=>i=setInterval(()=>change(step),130),420)});btn.addEventListener('pointerup',stop);btn.addEventListener('pointercancel',stop);btn.addEventListener('pointerleave',stop)}holdButton('minus',-.1);holdButton('plus',.1);$('openGraph').onclick=()=>page('graph');$('openHistory').onclick=()=>page('history');$('gminus').onclick=()=>{data.goal=Math.max(20,Math.round((Number(data.goal)-.1)*10)/10);persist();home();draw()};$('gplus').onclick=()=>{data.goal=Math.min(300,Math.round((Number(data.goal)+.1)*10)/10);persist();home();draw()};$('heightInput').onchange=()=>{const h=Number($('heightInput').value);data.profile.height=Number.isFinite(h)&&h>=100&&h<=250?h:null;persist();home()};$('eminus').onclick=()=>{$('editWeight').value=(Math.round((Number($('editWeight').value)-.1)*10)/10).toFixed(1)};$('eplus').onclick=()=>{$('editWeight').value=(Math.round((Number($('editWeight').value)+.1)*10)/10).toFixed(1)};$('saveEdit').onclick=()=>{if(!editing)return;data.records[editing]=Math.round(Number($('editWeight').value)*10)/10;persist();home();page('history')};$('deleteEdit').onclick=()=>{if(editing&&confirm('この記録を削除しますか？')){delete data.records[editing];persist();home();page('history')}};document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>page(b.dataset.page));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));draw()});persist();home();hist();draw()})();
</script>
</body>
</html>
