<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff5f8">
<title>体重管理</title>
<style>
:root{--pink:#cf3f70;--pink2:#e36f96;--pink3:#f5b7ca;--text:#493f49;--muted:#8b8088;--green:#34b989;--line:#f1e5e9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#fff5f8;color:var(--text);touch-action:manipulation}
body{overflow:hidden}.app{position:fixed;inset:0;max-width:520px;margin:auto;overflow:hidden;background:radial-gradient(circle at -8% 13%,rgba(247,202,216,.44) 0 110px,transparent 111px),radial-gradient(circle at 108% 14%,rgba(247,202,216,.36) 0 112px,transparent 113px),radial-gradient(circle at 2% 100%,rgba(247,202,216,.32) 0 145px,transparent 146px),radial-gradient(circle at 98% 103%,rgba(247,202,216,.27) 0 128px,transparent 129px),linear-gradient(180deg,#fffafb 0%,#fff1f5 100%)}
header{height:126px;display:flex;align-items:flex-start;justify-content:center;padding-top:44px;font-size:31px;font-weight:800;color:#c65077;letter-spacing:.02em;position:relative;z-index:2}header:after{content:"";position:absolute;top:96px;width:68px;height:6px;border-radius:999px;background:#ed91ad}
main{position:absolute;top:122px;bottom:0;left:0;right:0;padding:0 20px 28px;overflow:auto;-webkit-overflow-scrolling:touch}.hidden{display:none!important}.card{background:rgba(255,255,255,.91);border:1px solid rgba(255,255,255,.98);border-radius:31px;box-shadow:0 10px 28px rgba(207,63,112,.08)}
.weight-card{padding:31px 18px 34px;text-align:center}.eyebrow{font-size:21px;font-weight:700}.weight-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}.spark{display:flex;flex-direction:column;gap:11px}.spark i{display:block;width:27px;height:6px;border-radius:999px;background:#f2a8bc}.spark.left i:nth-child(1){transform:rotate(36deg)}.spark.left i:nth-child(3){transform:rotate(-36deg)}.spark.right i:nth-child(1){transform:rotate(-36deg)}.spark.right i:nth-child(3){transform:rotate(36deg)}.weight{font-size:72px;line-height:1;font-weight:800;color:var(--pink)}.weight small{font-size:28px;color:#4b414a;margin-left:6px}
.adjust{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:18px 0 20px}.adjust button{height:92px;border:0;border-radius:30px;position:relative;background:linear-gradient(135deg,#f8bfd0,#eda2b8);box-shadow:0 10px 22px rgba(216,71,118,.13);touch-action:none;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;appearance:none;-webkit-appearance:none;outline:none}.adjust button:last-child{background:linear-gradient(135deg,#ee9ab4,#e36f96)}.adjust button::after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:57px;font-weight:300;pointer-events:none}.adjust #minus::after{content:"−"}.adjust #plus::after{content:"＋"}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.mini{min-height:119px;padding:18px 16px;display:flex;align-items:center;gap:13px}.icon{width:57px;height:57px;flex:0 0 57px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffe8ef;color:#dc5e83}.icon svg{width:35px;height:35px;display:block}.mini .label{font-size:17px;font-weight:700}.mini .value{font-size:33px;font-weight:800;color:#d03f70;margin-top:4px;white-space:nowrap}.mini .value small{font-size:16px;color:#574b55}.delta-down{color:var(--green)!important}.delta-up{color:#d03f70!important}.delta-zero{color:#7f737c!important}
.bmi-card{margin-top:15px;padding:20px 18px;display:grid;grid-template-columns:57px 1fr auto;gap:15px;align-items:center}.bmi-main .label{font-size:17px;font-weight:700}.bmi-main .value{font-size:41px;font-weight:800;color:#d03f70}.badge{min-width:119px;text-align:center;padding:14px 20px;border-radius:999px;font-size:18px;font-weight:800;background:#e6f6ef;color:#2faa81}.badge.low{background:#edf3ff;color:#567bb5}.badge.high{background:#fff0f3;color:#d15272}.bmi-note{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-7px}
.menu{margin-top:15px;padding:0 19px}.menu button{width:100%;height:83px;border:0;background:transparent;display:grid;grid-template-columns:57px 1fr auto;align-items:center;text-align:left;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;color:var(--text);appearance:none}.menu button:last-child{border-bottom:0}.chev{font-size:37px;color:#da6288}.titlebar{display:flex;align-items:center;gap:10px;margin:6px 0 15px}.back{width:42px;height:42px;border:0;border-radius:50%;background:#ffe8ef;color:#d7567c;font-size:27px}.title{font-size:23px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.tab{border:0;border-radius:13px;padding:11px;background:#f0edf0;color:#756b74;font-weight:700}.tab.active{background:#df6289;color:white}.chart-wrap,.list-card,.settings-card,.edit-card{padding:16px}.chart-wrap svg{width:100%;height:300px;background:white;border-radius:20px}.row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.edit-link{border:0;background:none;color:#d94f79;font-size:22px}.setting{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.smallbtn{width:42px;height:42px;border:0;border-radius:50%;background:#ffe1eb;color:#d94f79;font-size:25px}.setting input,.edit-row input{width:110px;font-size:20px;padding:8px;border:1px solid #eadde2;border-radius:12px;text-align:center}.edit-row{display:flex;justify-content:center;align-items:center;gap:12px;margin:22px 0}.save,.danger{width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:800;margin-top:10px}.save{border:0;background:#d94f79;color:white}.danger{background:white;color:#d94f79;border:1px solid #d94f79}.date{font-size:14px;color:var(--muted)}
</style>
</head>
<body><div class="app"><header id="head">体重管理</header><main>
<section id="home"><div class="card weight-card"><div class="eyebrow">今日の体重</div><div class="weight-wrap"><span class="spark left"><i></i><i></i><i></i></span><div class="weight"><span id="weightHome">52.3</span><small>kg</small></div><span class="spark right"><i></i><i></i><i></i></span></div></div>
<div class="adjust"><button id="minus" aria-label="0.1kg減らす"></button><button id="plus" aria-label="0.1kg増やす"></button></div>
<div class="info-grid">
<div class="card mini"><div class="icon"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 5v30" stroke="#db5f84" stroke-width="4" stroke-linecap="round"/><path d="M12 7c7-3 12 3 19 0v14c-7 3-12-3-19 0z" fill="#ea7f9f"/></svg></div><div><div class="label">目標</div><div class="value"><span id="goalHome">50.0</span><small> kg</small></div></div></div>
<div class="card mini"><div class="icon"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="23" width="5" height="10" rx="2" fill="#f3a7bd"/><rect x="14" y="18" width="5" height="15" rx="2" fill="#ed8dac"/><rect x="21" y="12" width="5" height="21" rx="2" fill="#e9799f"/><rect x="28" y="7" width="5" height="26" rx="2" fill="#dc5f86"/></svg></div><div><div class="label">前回比</div><div id="previousDelta" class="value delta-zero">--<small> kg</small></div></div></div></div>
<div class="card bmi-card"><div class="icon"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 28a14 14 0 0 1 28 0" fill="none" stroke="#df6c90" stroke-width="4" stroke-linecap="round"/><path d="M20 14v4M10 22l3 2M30 22l-3 2" stroke="#df6c90" stroke-width="3" stroke-linecap="round"/><path d="M20 28l8-7" stroke="#df6c90" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="28" r="3" fill="#df6c90"/></svg></div><div class="bmi-main"><div class="label">BMI</div><div id="bmiValue" class="value">--</div></div><div id="bmiRating" class="badge">--</div><div id="bmiNote" class="bmi-note">設定で身長を入力してください</div></div>
<div class="card menu"><button id="openGraph"><span class="icon"><svg viewBox="0 0 40 40"><path d="M7 29l9-10 6 6 11-13" fill="none" stroke="#d9567d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 12h6v6" fill="none" stroke="#d9567d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>グラフを見る</span><span class="chev">›</span></button><button id="openHistory"><span class="icon"><svg viewBox="0 0 40 40"><rect x="10" y="6" width="20" height="28" rx="3" fill="none" stroke="#d9567d" stroke-width="4"/><path d="M15 14h10M15 20h10M15 26h7" stroke="#d9567d" stroke-width="3" stroke-linecap="round"/></svg></span><span>過去の記録</span><span class="chev">›</span></button></div></section>
<section id="graph" class="hidden"><div class="titlebar"><button class="back" data-back>‹</button><div class="title">グラフ</div></div><div class="tabs"><button class="tab active" data-days="7">1週間</button><button class="tab" data-days="30">1か月</button><button class="tab" data-days="365">1年</button></div><div class="card chart-wrap"><svg id="chart" viewBox="0 0 360 280"></svg></div></section>
<section id="history" class="hidden"><div class="titlebar"><button class="back" data-back>‹</button><div class="title">過去の記録</div></div><div class="card list-card" id="historyList"></div></section>
<section id="settings" class="hidden"><div class="titlebar"><button class="back" data-back>‹</button><div class="title">設定</div></div><div class="card settings-card"><div class="setting"><span>目標体重</span><div><button class="smallbtn" id="gminus">−</button><strong><span id="goalSetting">50.0</span> kg</strong><button class="smallbtn" id="gplus">＋</button></div></div><div class="setting"><span>身長</span><div><input id="heightInput" type="number" min="100" max="250" step="0.1" placeholder="未設定"> cm</div></div></div></section>
<section id="editPage" class="hidden"><div class="titlebar"><button class="back" id="backHistory">‹</button><div class="title">体重の編集</div></div><div class="card edit-card"><div class="date" id="editDate"></div><div class="edit-row"><button class="smallbtn" id="eminus">−</button><input id="editWeight" type="number" step="0.1"><button class="smallbtn" id="eplus">＋</button></div><button class="save" id="saveEdit">保存</button><button class="danger" id="deleteEdit">この記録を削除</button></div></section>
</main></div>
<script>
(()=>{const $=id=>document.getElementById(id),KEY='weightAppLive1';const today=new Date();today.setHours(0,0,0,0);const pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),todayKey=key(today);function seed(){const r={},v=[52.9,52.7,52.6,52.5,52.4,52.5,52.3];for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);r[key(d)]=v[6-i]}return{goal:50,records:r,profile:{height:null}}}let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){data=seed()}if(!data.profile)data.profile={height:null};if(!data.records)data.records={};if(data.records[todayKey]==null)data.records[todayKey]=52.3;let days=7,editing=null;const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};const w=()=>Number(data.records[todayKey]);function previousValue(){const ks=Object.keys(data.records).filter(k=>k<todayKey&&Number.isFinite(Number(data.records[k]))).sort();return ks.length?Number(data.records[ks[ks.length-1]]):null}function renderPrevious(){const prev=previousValue(),el=$('previousDelta');if(prev==null){el.className='value delta-zero';el.innerHTML='--<small> kg</small>';return}const diff=Math.round((w()-prev)*10)/10;el.className='value '+(diff<0?'delta-down':diff>0?'delta-up':'delta-zero');el.innerHTML=(diff>0?'+':'')+diff.toFixed(1)+'<small> kg</small>'}function renderBMI(){const h=Number(data.profile.height),weight=w(),value=$('bmiValue'),rating=$('bmiRating'),note=$('bmiNote');if(!Number.isFinite(h)||h<100||h>250){value.textContent='--';rating.textContent='--';rating.className='badge';note.textContent='設定で身長を入力してください';return}const bmi=weight/Math.pow(h/100,2);value.textContent=bmi.toFixed(1);note.textContent='';if(bmi<18.5){rating.textContent='低め';rating.className='badge low'}else if(bmi<25){rating.textContent='普通';rating.className='badge'}else{rating.textContent='高め';rating.className='badge high'}}function home(){$('weightHome').textContent=w().toFixed(1);$('goalHome').textContent=Number(data.goal).toFixed(1);$('goalSetting').textContent=Number(data.goal).toFixed(1);$('heightInput').value=data.profile.height??'';renderPrevious();renderBMI()}function change(step){data.records[todayKey]=Math.max(20,Math.min(300,Math.round((w()+step)*10)/10));persist();home();hist();draw()}function page(p){['home','graph','history','settings','editPage'].forEach(id=>$(id).classList.toggle('hidden',id!==p));$('head').textContent=p==='home'?'体重管理':p==='graph'?'グラフ':p==='history'?'過去の記録':p==='settings'?'設定':'体重の編集';if(p==='graph')draw();if(p==='history')hist()}function hist(){const ks=Object.keys(data.records).sort().reverse();$('historyList').innerHTML=ks.map(k=>{const d=new Date(k+'T00:00:00');return '<div class="row"><span>'+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日</span><span><strong>'+Number(data.records[k]).toFixed(1)+' kg</strong> <button class="edit-link" data-k="'+k+'">›</button></span></div>'}).join('')||'<div style="padding:10px;text-align:center;color:#877985">記録がありません</div>';document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>openEdit(b.dataset.k))}function openEdit(k){editing=k;const d=new Date(k+'T00:00:00');$('editDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';$('editWeight').value=Number(data.records[k]).toFixed(1);page('editPage')}function draw(){const cutoff=new Date(today);cutoff.setDate(cutoff.getDate()-(days-1));const pts=Object.entries(data.records).map(([k,v])=>({d:new Date(k+'T00:00:00'),v:Number(v)})).filter(p=>p.d>=cutoff&&p.d<=today&&Number.isFinite(p.v)).sort((a,b)=>a.d-b.d),svg=$('chart');if(!pts.length){svg.innerHTML='<text x="180" y="140" text-anchor="middle" fill="#877985">記録がありません</text>';return}const W=360,H=280,L=42,R=18,T=24,B=42,vals=pts.map(p=>p.v).concat([Number(data.goal)]);let mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);if(mx-mn<4)mx=mn+4;const x=i=>L+(W-L-R)*(pts.length===1?.5:i/(pts.length-1)),y=v=>T+(H-T-B)*(mx-v)/(mx-mn);let s='';for(let n=mn;n<=mx;n++){const yy=y(n);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#f0edf0"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#9a8d96">'+n+'</text>'}const gy=y(Number(data.goal));s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="#d94f79" stroke-dasharray="6 5"/>';s+='<path d="'+pts.map((p,i)=>(i?'L':'M')+' '+x(i)+' '+y(p.v)).join(' ')+'" fill="none" stroke="#e36e93" stroke-width="3"/>';pts.forEach((p,i)=>s+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="4" fill="#d94f79"/>');svg.innerHTML=s}
function bindHold(id,step){const btn=$(id);let delay=null,repeat=null,down=false;const stop=()=>{down=false;clearTimeout(delay);clearInterval(repeat);delay=repeat=null};btn.addEventListener('pointerdown',e=>{e.preventDefault();stop();down=true;change(step);if(btn.setPointerCapture)try{btn.setPointerCapture(e.pointerId)}catch(_){ }delay=setTimeout(()=>{if(!down)return;repeat=setInterval(()=>{if(down)change(step)},120)},400)});btn.addEventListener('pointerup',stop);btn.addEventListener('pointercancel',stop);btn.addEventListener('lostpointercapture',stop);btn.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('blur',stop)}bindHold('minus',-.1);bindHold('plus',.1);
$('openGraph').onclick=()=>page('graph');$('openHistory').onclick=()=>page('history');document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>page('home'));$('backHistory').onclick=()=>page('history');$('gminus').onclick=()=>{data.goal=Math.max(20,Math.round((Number(data.goal)-.1)*10)/10);persist();home();draw()};$('gplus').onclick=()=>{data.goal=Math.min(300,Math.round((Number(data.goal)+.1)*10)/10);persist();home();draw()};$('heightInput').onchange=()=>{const h=Number($('heightInput').value);data.profile.height=Number.isFinite(h)&&h>=100&&h<=250?h:null;persist();home()};$('eminus').onclick=()=>{$('editWeight').value=(Math.round((Number($('editWeight').value)-.1)*10)/10).toFixed(1)};$('eplus').onclick=()=>{$('editWeight').value=(Math.round((Number($('editWeight').value)+.1)*10)/10).toFixed(1)};$('saveEdit').onclick=()=>{if(!editing)return;data.records[editing]=Math.round(Number($('editWeight').value)*10)/10;persist();home();page('history')};$('deleteEdit').onclick=()=>{if(editing&&confirm('この記録を削除しますか？')){delete data.records[editing];persist();home();page('history')}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));draw()});persist();home();hist();draw()})();
</script></body></html>
