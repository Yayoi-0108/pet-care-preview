<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff5f8">
<title>体重管理</title>
<style>
:root{--pink:#cf3f70;--pink2:#e9789c;--pink3:#f4b5c8;--text:#473c47;--muted:#8d8189;--green:#38b98b;--line:#f2e4e9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#fff5f8;color:var(--text);touch-action:manipulation}
body{overflow:hidden}.app{position:fixed;inset:0;max-width:520px;margin:auto;overflow:hidden;background:radial-gradient(circle at -8% 13%,rgba(247,202,216,.42) 0 105px,transparent 106px),radial-gradient(circle at 108% 14%,rgba(247,202,216,.35) 0 110px,transparent 111px),radial-gradient(circle at 4% 100%,rgba(247,202,216,.32) 0 135px,transparent 136px),radial-gradient(circle at 96% 103%,rgba(247,202,216,.26) 0 125px,transparent 126px),linear-gradient(180deg,#fffafb,#fff1f5)}
header{height:128px;display:flex;align-items:flex-start;justify-content:center;padding-top:44px;font-size:31px;font-weight:800;color:#c34f76;position:relative;z-index:2}header:after{content:"";position:absolute;top:96px;width:69px;height:6px;border-radius:999px;background:#ed91ad}.back{position:absolute;left:18px;top:42px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#d35b82;font-size:28px;display:none;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(207,63,112,.08)}
main{position:absolute;top:122px;bottom:0;left:0;right:0;padding:0 20px 28px;overflow:auto;-webkit-overflow-scrolling:touch;z-index:1}.screen{display:none;min-height:100%}.screen.active{display:block}.card{background:rgba(255,255,255,.91);border:1px solid rgba(255,255,255,.97);border-radius:31px;box-shadow:0 10px 28px rgba(207,63,112,.08)}
.weight-card{padding:31px 18px 34px;text-align:center}.eyebrow{font-size:21px;font-weight:700}.weight-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}.spark{display:flex;flex-direction:column;gap:11px}.spark i{display:block;width:27px;height:6px;border-radius:999px;background:#f3a9bd}.spark.left i:nth-child(1){transform:rotate(36deg)}.spark.left i:nth-child(3){transform:rotate(-36deg)}.spark.right i:nth-child(1){transform:rotate(-36deg)}.spark.right i:nth-child(3){transform:rotate(36deg)}.weight{font-size:72px;line-height:1;font-weight:800;color:#cf3f70}.weight small{font-size:28px;color:#4b414a;margin-left:6px}
.adjust{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:18px 0 20px}.adjust button{height:92px;border:0;border-radius:30px;position:relative;background:linear-gradient(135deg,#f8bfd0,#eda2b8);box-shadow:0 10px 22px rgba(216,71,118,.13);touch-action:none;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;appearance:none;-webkit-appearance:none;outline:none}.adjust button:last-child{background:linear-gradient(135deg,#ee9ab4,#e36f96)}.adjust button::after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:57px;font-weight:300;pointer-events:none}.adjust #minus::after{content:"−"}.adjust #plus::after{content:"＋"}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.mini{min-height:119px;padding:18px 16px;display:flex;align-items:center;gap:13px}.icon{width:57px;height:57px;flex:0 0 57px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffe8ef;color:#dc5e83}.flag-icon{position:relative}.flag-icon:before{content:"";position:absolute;width:5px;height:35px;border-radius:5px;background:#de6488;left:18px;top:11px}.flag-icon:after{content:"";position:absolute;width:25px;height:18px;left:22px;top:13px;background:#ef7fa0;border-radius:2px 10px 10px 2px;clip-path:polygon(0 0,100% 14%,78% 50%,100% 86%,0 100%)}.bar-icon{align-items:flex-end;gap:3px}.bar-icon i{display:block;width:6px;border-radius:6px;background:#df678a}.bar-icon i:nth-child(1){height:14px;opacity:.55}.bar-icon i:nth-child(2){height:21px;opacity:.7}.bar-icon i:nth-child(3){height:29px;opacity:.86}.bar-icon i:nth-child(4){height:37px}.mini .label{font-size:17px;font-weight:700}.mini .value{font-size:33px;font-weight:800;color:#d03f70;margin-top:4px;white-space:nowrap}.mini .value small{font-size:16px;color:#574b55}.delta-down{color:var(--green)!important}.delta-up{color:#d03f70!important}.delta-zero{color:#7f737c!important}
.bmi-card{margin-top:15px;padding:20px 18px;display:grid;grid-template-columns:57px 1fr auto;gap:15px;align-items:center}.gauge{position:relative}.gauge:before{content:"◔";font-size:32px}.bmi-main .label{font-size:17px;font-weight:700}.bmi-main .value{font-size:41px;font-weight:800;color:#d03f70}.badge{min-width:119px;text-align:center;padding:14px 20px;border-radius:999px;font-size:18px;font-weight:800;background:#e6f6ef;color:#2faa81}.badge.low{background:#edf3ff;color:#567bb5}.badge.high{background:#fff0f3;color:#d15272}.bmi-note{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-7px}
.menu{margin-top:15px;padding:0 19px}.menu button{width:100%;height:83px;border:0;background:transparent;display:grid;grid-template-columns:57px 1fr auto;align-items:center;text-align:left;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;color:var(--text)}.menu button:last-child{border-bottom:0}.menu .icon{font-size:30px}.chev{font-size:37px;color:#da6288}
.inner-title{font-size:22px;font-weight:800;margin:8px 0 16px;color:#5a4d57}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.tab{border:0;border-radius:18px;padding:12px;background:#fff;color:#8b7e88;font-weight:700;box-shadow:0 8px 20px rgba(207,63,112,.07)}.tab.active{background:linear-gradient(135deg,#ee9ab4,#e36f96);color:white}.panel{padding:18px}.chart-wrap svg{width:100%;height:290px;background:rgba(255,255,255,.95);border-radius:22px}.row{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.edit-link{border:0;background:#ffe8ef;color:#d94f79;width:38px;height:38px;border-radius:50%;font-size:24px}.setting{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.smallbtn{width:42px;height:42px;border:0;border-radius:50%;background:#ffe1eb;color:#d94f79;font-size:25px}.setting input,.edit-row input{width:110px;font-size:20px;padding:9px;border:1px solid #eadde2;border-radius:14px;text-align:center;background:#fff}.edit-row{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0}.save,.danger,.soft-action{width:100%;padding:15px;border-radius:18px;font-size:16px;font-weight:800;margin-top:12px}.save{border:0;background:linear-gradient(135deg,#ee9ab4,#e36f96);color:white}.danger{background:white;color:#d94f79;border:1px solid #efb7c8}.soft-action{background:#fff;border:0;color:#d25279;box-shadow:0 8px 18px rgba(207,63,112,.06)}.date{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<header><button id="backBtn" class="back" aria-label="ホームに戻る">‹</button><span id="head">体重管理</span></header>
<main>
<section id="home" class="screen active">
  <div class="card weight-card"><div class="eyebrow">今日の体重</div><div class="weight-wrap"><span class="spark left"><i></i><i></i><i></i></span><div class="weight"><span id="weightHome">52.3</span><small>kg</small></div><span class="spark right"><i></i><i></i><i></i></span></div></div>
  <div class="adjust"><button id="minus" aria-label="0.1kg減らす"></button><button id="plus" aria-label="0.1kg増やす"></button></div>
  <div class="info-grid">
    <div class="card mini"><div class="icon flag-icon"></div><div><div class="label">目標</div><div class="value"><span id="goalHome">50.0</span><small> kg</small></div></div></div>
    <div class="card mini"><div class="icon bar-icon"><i></i><i></i><i></i><i></i></div><div><div class="label">前回比</div><div id="previousDelta" class="value delta-zero">--<small> kg</small></div></div></div>
  </div>
  <div class="card bmi-card"><div class="icon gauge"></div><div class="bmi-main"><div class="label">BMI</div><div id="bmiValue" class="value">--</div></div><div id="bmiRating" class="badge">--</div><div id="bmiNote" class="bmi-note">設定で身長を入力してください</div></div>
  <div class="card menu"><button id="openGraph"><span class="icon">↗</span><span>グラフを見る</span><span class="chev">›</span></button><button id="openHistory"><span class="icon">▤</span><span>過去の記録</span><span class="chev">›</span></button></div>
</section>
<section id="graph" class="screen"><div class="inner-title">体重の変化</div><div class="tabs"><button class="tab active" data-days="7">1週間</button><button class="tab" data-days="30">1か月</button><button class="tab" data-days="365">1年</button></div><div class="card panel chart-wrap"><svg id="chart" viewBox="0 0 360 280"></svg></div></section>
<section id="history" class="screen"><div class="inner-title">過去の記録</div><div class="card panel" id="historyList"></div><button id="openSettings" class="soft-action">設定を開く</button></section>
<section id="settings" class="screen"><div class="inner-title">設定</div><div class="card panel"><div class="setting"><span>目標体重</span><div><button class="smallbtn" id="gminus">−</button><strong style="display:inline-block;min-width:82px;text-align:center"><span id="goalSetting">50.0</span> kg</strong><button class="smallbtn" id="gplus">＋</button></div></div><div class="setting"><span>身長</span><div><input id="heightInput" type="number" min="100" max="250" step="0.1" placeholder="未設定"> cm</div></div></div></section>
<section id="editPage" class="screen"><div class="inner-title">体重の編集</div><div class="card panel"><div class="date" id="editDate"></div><div class="edit-row"><button class="smallbtn" id="eminus">−</button><input id="editWeight" type="number" step="0.1"><button class="smallbtn" id="eplus">＋</button></div><button class="save" id="saveEdit">保存</button><button class="danger" id="deleteEdit">この記録を削除</button></div></section>
</main>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),KEY='weightAppLive1';
const today=new Date();today.setHours(0,0,0,0);const pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),todayKey=key(today);
function seed(){const r={},v=[52.9,52.7,52.6,52.5,52.4,52.5,52.3];for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);r[key(d)]=v[6-i]}return{goal:50,records:r,profile:{height:null}}}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){data=seed()}if(!data.profile)data.profile={height:null};if(!data.records)data.records={};if(data.records[todayKey]==null)data.records[todayKey]=52.3;
let days=7,editing=null,current='home';const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};const w=()=>Number(data.records[todayKey]);
function previousValue(){const ks=Object.keys(data.records).filter(k=>k<todayKey&&Number.isFinite(Number(data.records[k]))).sort();return ks.length?Number(data.records[ks[ks.length-1]]):null}
function renderPrevious(){const prev=previousValue(),el=$('previousDelta');if(prev==null){el.className='value delta-zero';el.innerHTML='--<small> kg</small>';return}const diff=Math.round((w()-prev)*10)/10;el.className='value '+(diff<0?'delta-down':diff>0?'delta-up':'delta-zero');el.innerHTML=(diff>0?'+':'')+diff.toFixed(1)+'<small> kg</small>'}
function renderBMI(){const h=Number(data.profile.height),weight=w(),value=$('bmiValue'),rating=$('bmiRating'),note=$('bmiNote');if(!Number.isFinite(h)||h<100||h>250){value.textContent='--';rating.textContent='--';rating.className='badge';note.textContent='設定で身長を入力してください';return}const bmi=weight/Math.pow(h/100,2);value.textContent=bmi.toFixed(1);note.textContent='';if(bmi<18.5){rating.textContent='低め';rating.className='badge low'}else if(bmi<25){rating.textContent='普通';rating.className='badge'}else{rating.textContent='高め';rating.className='badge high'}}
function renderHome(){$('weightHome').textContent=w().toFixed(1);$('goalHome').textContent=Number(data.goal).toFixed(1);$('goalSetting').textContent=Number(data.goal).toFixed(1);$('heightInput').value=data.profile.height??'';renderPrevious();renderBMI()}
function change(step){data.records[todayKey]=Math.max(20,Math.min(300,Math.round((w()+step)*10)/10));persist();renderHome();renderHistory();draw()}
function showScreen(name){current=name;document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(name).classList.add('active');$('backBtn').style.display=name==='home'?'none':'flex';$('head').textContent=name==='home'?'体重管理':name==='graph'?'グラフ':name==='history'?'過去の記録':name==='settings'?'設定':'体重の編集';document.querySelector('main').scrollTop=0;if(name==='home')renderHome();if(name==='graph')draw();if(name==='history')renderHistory()}
function renderHistory(){const ks=Object.keys(data.records).sort().reverse();$('historyList').innerHTML=ks.map(k=>{const d=new Date(k+'T00:00:00');return '<div class="row"><span>'+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日</span><span><strong>'+Number(data.records[k]).toFixed(1)+' kg</strong> <button class="edit-link" data-k="'+k+'">›</button></span></div>'}).join('')||'<div style="padding:10px;text-align:center;color:#877985">記録がありません</div>';document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>openEdit(b.dataset.k))}
function openEdit(k){editing=k;const d=new Date(k+'T00:00:00');$('editDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';$('editWeight').value=Number(data.records[k]).toFixed(1);showScreen('editPage')}
function draw(){const cutoff=new Date(today);cutoff.setDate(cutoff.getDate()-(days-1));const pts=Object.entries(data.records).map(([k,v])=>({d:new Date(k+'T00:00:00'),v:Number(v)})).filter(p=>p.d>=cutoff&&p.d<=today&&Number.isFinite(p.v)).sort((a,b)=>a.d-b.d),svg=$('chart');if(!pts.length){svg.innerHTML='<text x="180" y="140" text-anchor="middle" fill="#877985">記録がありません</text>';return}const W=360,H=280,L=42,R=18,T=24,B=42,vals=pts.map(p=>p.v).concat([Number(data.goal)]);let mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);if(mx-mn<4)mx=mn+4;const x=i=>L+(W-L-R)*(pts.length===1?.5:i/(pts.length-1)),y=v=>T+(H-T-B)*(mx-v)/(mx-mn);let s='';for(let n=mn;n<=mx;n++){const yy=y(n);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#f0edf0"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#9a8d96">'+n+'</text>'}const gy=y(Number(data.goal));s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="#d94f79" stroke-dasharray="6 5"/>';s+='<path d="'+pts.map((p,i)=>(i?'L':'M')+' '+x(i)+' '+y(p.v)).join(' ')+'" fill="none" stroke="#e36e93" stroke-width="3"/>';pts.forEach((p,i)=>s+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="4" fill="#d94f79"/>');svg.innerHTML=s}
function bindHold(id,step){const btn=$(id);let delay=null,repeat=null,holding=false;const stop=()=>{holding=false;clearTimeout(delay);clearInterval(repeat);delay=repeat=null};const start=e=>{e.preventDefault();stop();holding=true;change(step);delay=setTimeout(()=>{if(!holding)return;repeat=setInterval(()=>{if(holding)change(step)},125)},420)};btn.addEventListener('touchstart',start,{passive:false});btn.addEventListener('touchend',stop,{passive:false});btn.addEventListener('touchcancel',stop,{passive:false});btn.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')start(e)});btn.addEventListener('pointerup',stop);btn.addEventListener('pointercancel',stop);btn.addEventListener('pointerleave',stop);btn.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('blur',stop)}
bindHold('minus',-.1);bindHold('plus',.1);
$('openGraph').onclick=()=>showScreen('graph');$('openHistory').onclick=()=>showScreen('history');$('backBtn').onclick=()=>showScreen('home');$('openSettings').onclick=()=>showScreen('settings');
$('gminus').onclick=()=>{data.goal=Math.max(20,Math.round((Number(data.goal)-.1)*10)/10);persist();renderHome();draw()};$('gplus').onclick=()=>{data.goal=Math.min(300,Math.round((Number(data.goal)+.1)*10)/10);persist();renderHome();draw()};$('heightInput').onchange=()=>{const h=Number($('heightInput').value);data.profile.height=Number.isFinite(h)&&h>=100&&h<=250?h:null;persist();renderHome()};
$('eminus').onclick=()=>{$('editWeight').value=(Math.round((Number($('editWeight').value)-.1)*10)/10).toFixed(1)};$('eplus').onclick=()=>{$('editWeight').value=(Math.round((Number($('editWeight').value)+.1)*10)/10).toFixed(1)};$('saveEdit').onclick=()=>{if(!editing)return;data.records[editing]=Math.round(Number($('editWeight').value)*10)/10;persist();renderHome();showScreen('history')};$('deleteEdit').onclick=()=>{if(editing&&confirm('この記録を削除しますか？')){delete data.records[editing];persist();renderHome();showScreen('history')}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));draw()});
persist();renderHome();renderHistory();draw();showScreen('home');
})();
</script>
</body>
</html>
