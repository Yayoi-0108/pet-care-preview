<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff4f8">
<title>体重管理</title>
<style>
:root{--pink:#d43370;--pink2:#e46f98;--pink3:#f5b2c7;--text:#453b46;--muted:#8d8189;--green:#22b985;--line:#f0dfe5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#fff4f8;color:var(--text)}
body{overflow:hidden}.app{position:fixed;inset:0;max-width:430px;margin:auto;overflow:hidden;background:radial-gradient(circle at -8% 11%,rgba(247,201,216,.43) 0 100px,transparent 101px),radial-gradient(circle at 108% 13%,rgba(247,201,216,.36) 0 105px,transparent 106px),radial-gradient(circle at -2% 96%,rgba(247,201,216,.34) 0 125px,transparent 126px),radial-gradient(circle at 98% 102%,rgba(247,201,216,.25) 0 120px,transparent 121px),linear-gradient(180deg,#fff9fb 0%,#fff0f5 100%)}
header{height:118px;position:relative;display:flex;align-items:flex-start;justify-content:center;padding-top:37px;color:#c74673;font-size:29px;font-weight:800;letter-spacing:.02em}header:after{content:"";position:absolute;top:89px;width:65px;height:5px;border-radius:99px;background:#ed88a8}.back{display:none;position:absolute;left:15px;top:35px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.94);color:#d35b82;font-size:29px;box-shadow:0 7px 17px rgba(207,63,112,.08)}
main{position:absolute;top:112px;bottom:0;left:0;right:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 18px 26px}.screen{display:none}.screen.active{display:block}
.card{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.98);box-shadow:0 10px 25px rgba(207,63,112,.07);border-radius:29px}
/* HOME LOCKED: 完成形の見た目はここから変更しない */
.home-weight{padding:27px 18px 31px;text-align:center}.home-weight .label{font-size:20px;font-weight:750}.weight-line{margin-top:17px;display:flex;align-items:center;justify-content:center;gap:13px}.weight-number{font-size:69px;line-height:1;font-weight:800;color:#d22e6c;font-variant-numeric:tabular-nums}.weight-number small{font-size:27px;color:#443b45;margin-left:6px;font-weight:650}.rays{display:flex;flex-direction:column;gap:10px}.rays i{width:25px;height:5px;background:#f3a8bd;border-radius:99px;display:block}.rays.left i:nth-child(1){transform:rotate(36deg)}.rays.left i:nth-child(3){transform:rotate(-36deg)}.rays.right i:nth-child(1){transform:rotate(-36deg)}.rays.right i:nth-child(3){transform:rotate(36deg)}
.adjust{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:15px 0 16px}.adjust button{height:84px;border:0;border-radius:27px;position:relative;background:linear-gradient(135deg,#f6bfd0,#eca5b9);box-shadow:0 9px 20px rgba(216,71,118,.13);touch-action:none;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;appearance:none}.adjust button:last-child{background:linear-gradient(135deg,#ed99b4,#e06b94)}.adjust button:after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:55px;font-weight:300;pointer-events:none}.adjust #minus:after{content:"−"}.adjust #plus:after{content:"＋"}
.home-pair{display:grid;grid-template-columns:1fr 1fr;gap:13px}.mini{min-height:105px;padding:16px 14px;display:flex;align-items:center;gap:12px}.round-icon{width:55px;height:55px;flex:0 0 55px;border-radius:50%;background:#ffe5ed;display:flex;align-items:center;justify-content:center;color:#dd5a83}.flag-icon{position:relative}.flag-icon:before{content:"";position:absolute;left:17px;top:10px;width:5px;height:36px;background:#dc5a83;border-radius:5px}.flag-icon:after{content:"";position:absolute;left:21px;top:12px;width:26px;height:19px;background:#ed7197;clip-path:polygon(0 0,100% 14%,78% 50%,100% 86%,0 100%);border-radius:2px 8px 8px 2px}.bars{align-items:flex-end;gap:3px}.bars i{display:block;width:6px;border-radius:5px;background:#df6589}.bars i:nth-child(1){height:13px;opacity:.58}.bars i:nth-child(2){height:20px;opacity:.72}.bars i:nth-child(3){height:28px;opacity:.87}.bars i:nth-child(4){height:36px}.mini .txt{font-size:16px;font-weight:750}.mini .val{margin-top:2px;font-size:31px;line-height:1.08;font-weight:800;color:#d12f6c;white-space:nowrap}.mini .val small{font-size:15px;color:#4f444d}.val.down{color:var(--green)}.val.up{color:#d12f6c}.val.zero{color:#7c7079}
.bmi{margin-top:14px;min-height:112px;padding:17px 17px;display:grid;grid-template-columns:55px 1fr auto;align-items:center;gap:13px}.gauge{position:relative}.gauge:before{content:"";position:absolute;left:12px;top:16px;width:31px;height:16px;border:4px solid #e2648c;border-bottom:0;border-radius:32px 32px 0 0}.gauge:after{content:"";position:absolute;left:26px;top:27px;width:18px;height:4px;background:#e2648c;border-radius:5px;transform:rotate(-42deg);transform-origin:left center}.bmi .txt{font-size:16px;font-weight:750}.bmi .num{font-size:40px;line-height:1.05;font-weight:800;color:#d12f6c}.pill{min-width:105px;padding:13px 17px;border-radius:999px;background:#ddf3ea;color:#19a879;text-align:center;font-size:18px;font-weight:800}.pill.low{background:#edf3ff;color:#557cb5}.pill.high{background:#fff0f3;color:#d15272}.bmi-note{grid-column:2/4;font-size:11px;color:var(--muted);margin-top:-6px}
.home-menu{margin-top:14px;display:grid;gap:13px}.home-menu button{height:78px;width:100%;border:0;border-radius:27px;background:rgba(255,255,255,.92);box-shadow:0 10px 25px rgba(207,63,112,.07);display:grid;grid-template-columns:55px 1fr auto;align-items:center;padding:0 17px;text-align:left;color:var(--text);font-size:19px;font-weight:750}.trend{font-size:30px}.doc{font-size:28px}.chev{font-size:36px;color:#d95c84;font-weight:300}
/* 機能画面 */
.inner-title{font-size:22px;font-weight:800;margin:7px 0 14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.tab{border:0;border-radius:16px;padding:11px 4px;background:#fff;color:#847782;font-weight:700;box-shadow:0 6px 16px rgba(207,63,112,.06)}.tab.active{background:linear-gradient(135deg,#ed9ab4,#df6b94);color:#fff}.panel{padding:15px}.period-note{text-align:center;color:#7c7079;font-size:13px;margin-bottom:8px}.chart-legend{display:flex;justify-content:center;gap:14px;align-items:center;margin:0 0 10px;font-size:13px;color:#6f626c}.legend-item{display:flex;align-items:center;gap:7px}.legend-line{width:28px;height:4px;border-radius:99px;background:#df5d88}.chart-wrap svg{width:100%;height:315px;background:#fff;border-radius:21px;display:block}
.calendar-card{padding:14px}.cal-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:10px}.cal-head button{width:38px;height:38px;border:0;border-radius:50%;background:#ffe7ef;color:#d6537c;font-size:25px;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;appearance:none}.cal-title{text-align:center;font-size:19px;font-weight:800}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays div{text-align:center;font-size:12px;color:#8c7f88;padding:4px 0}.day{min-height:63px;border:0;border-radius:14px;background:#fff8fa;padding:6px 2px;text-align:center;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.day.empty{background:transparent;pointer-events:none}.day .n{font-size:13px;font-weight:700}.day .wgt{margin-top:7px;font-size:12px;font-weight:800;color:#d13d70;white-space:nowrap}.day.no-record .wgt{color:#c9b9c0;font-weight:600}.day.today{box-shadow:inset 0 0 0 2px #efa0b8}.day.has-record{background:#fff0f5}.calendar-help{text-align:center;color:#8b7f87;font-size:12px;margin:11px 0 2px}.soft-action,.save,.danger{width:100%;padding:14px;border-radius:17px;font-size:16px;font-weight:800;margin-top:12px}.soft-action{border:0;background:#fff;color:#d25279;box-shadow:0 8px 18px rgba(207,63,112,.06)}.setting{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.setting strong,.setting strong *{-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;touch-action:manipulation}.smallbtn{width:42px;height:42px;border:0;border-radius:50%;background:#ffe1eb;color:#d94f79;font-size:25px;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;appearance:none}.setting input,.edit-row input{width:105px;font-size:20px;padding:8px;border:1px solid #eadde2;border-radius:13px;text-align:center;background:#fff}.edit-row{display:flex;justify-content:center;align-items:center;gap:12px;margin:22px 0}.save{border:0;background:linear-gradient(135deg,#ed99b4,#df6b94);color:#fff}.danger{background:#fff;color:#d94f79;border:1px solid #efb7c8}.date{font-size:16px;font-weight:700;text-align:center;color:#665a63}.edit-hint{text-align:center;font-size:12px;color:#8d8189;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header><button id="backBtn" class="back" aria-label="ホームに戻る">‹</button><span id="head">体重管理</span></header>
<main>
<section id="home" class="screen active">
  <div class="card home-weight"><div class="label">今日の体重</div><div class="weight-line"><span class="rays left"><i></i><i></i><i></i></span><div class="weight-number"><span id="weightHome">52.3</span><small>kg</small></div><span class="rays right"><i></i><i></i><i></i></span></div></div>
  <div class="adjust"><button id="minus" aria-label="0.1kg減らす"></button><button id="plus" aria-label="0.1kg増やす"></button></div>
  <div class="home-pair"><div class="card mini"><div class="round-icon flag-icon"></div><div><div class="txt">目標</div><div class="val"><span id="goalHome">50.0</span><small> kg</small></div></div></div><div class="card mini"><div class="round-icon bars"><i></i><i></i><i></i><i></i></div><div><div class="txt">前回比</div><div id="previousDelta" class="val zero">--<small> kg</small></div></div></div></div>
  <div class="card bmi"><div class="round-icon gauge"></div><div><div class="txt">BMI</div><div id="bmiValue" class="num">--</div></div><div id="bmiRating" class="pill">--</div><div id="bmiNote" class="bmi-note">設定で身長を入力してください</div></div>
  <div class="home-menu"><button id="openGraph"><span class="round-icon trend">↗</span><span>グラフを見る</span><span class="chev">›</span></button><button id="openHistory"><span class="round-icon doc">▤</span><span>過去の記録</span><span class="chev">›</span></button></div>
</section>
<section id="graph" class="screen"><div class="inner-title">体重の変化</div><div class="tabs"><button class="tab active" data-days="7">1週間</button><button class="tab" data-days="30">1か月</button><button class="tab" data-days="365">1年</button></div><div id="periodNote" class="period-note"></div><div class="card panel chart-wrap"><svg id="chart" viewBox="0 0 360 315"></svg></div></section>
<section id="history" class="screen"><div class="inner-title">過去の記録</div><div class="card calendar-card"><div class="cal-head"><button id="prevMonth" aria-label="前の月">‹</button><div id="calTitle" class="cal-title"></div><button id="nextMonth" aria-label="次の月">›</button></div><div class="weekdays"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="calendarGrid" class="calendar-grid"></div><div class="calendar-help">日付をタップすると、その日の体重を編集できます</div></div><button id="openSettings" class="soft-action">設定を開く</button></section>
<section id="settings" class="screen"><div class="inner-title">設定</div><div class="card panel"><div class="setting"><span>目標体重</span><div><button class="smallbtn" id="gminus">−</button><strong style="display:inline-block;min-width:80px;text-align:center"><span id="goalSetting">50.0</span> kg</strong><button class="smallbtn" id="gplus">＋</button></div></div><div class="setting"><span>身長</span><div><input id="heightInput" type="number" min="100" max="250" step="0.1" placeholder="未設定"> cm</div></div></div></section>
<section id="editPage" class="screen"><div class="inner-title">体重の編集</div><div class="card panel"><div class="date" id="editDate"></div><div class="edit-row"><button class="smallbtn" id="eminus">−</button><input id="editWeight" type="number" step="0.1"><button class="smallbtn" id="eplus">＋</button></div><div id="editHint" class="edit-hint"></div><button id="saveEdit" class="save">保存</button><button id="deleteEdit" class="danger">この記録を削除</button></div></section>
</main>
</div>
<script>
(()=>{const $=id=>document.getElementById(id),KEY='weightAppLive1';const today=new Date();today.setHours(0,0,0,0);const pad=n=>String(n).padStart(2,'0'),dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),todayKey=dateKey(today);function seed(){const r={},v=[52.9,52.7,52.6,52.5,52.4,52.5,52.3];for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);r[dateKey(d)]=v[6-i]}return{goal:50,records:r,profile:{height:null}}}let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){data=seed()}if(!data.profile)data.profile={height:null};if(!data.records)data.records={};if(data.records[todayKey]==null)data.records[todayKey]=52.3;let days=7,editing=null,current='home';let calCursor=new Date(today.getFullYear(),today.getMonth(),1);const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};const w=()=>Number(data.records[todayKey]);function prev(){const ks=Object.keys(data.records).filter(k=>k<todayKey&&Number.isFinite(Number(data.records[k]))).sort();return ks.length?Number(data.records[ks.at(-1)]):null}
function renderHome(){$('weightHome').textContent=w().toFixed(1);$('goalHome').textContent=Number(data.goal).toFixed(1);$('goalSetting').textContent=Number(data.goal).toFixed(1);$('heightInput').value=data.profile.height??'';const p=prev(),el=$('previousDelta');if(p==null){el.className='val zero';el.innerHTML='--<small> kg</small>'}else{const d=Math.round((w()-p)*10)/10;el.className='val '+(d<0?'down':d>0?'up':'zero');el.innerHTML=(d>0?'+':'')+d.toFixed(1)+'<small> kg</small>'}const h=Number(data.profile.height),bv=$('bmiValue'),br=$('bmiRating'),bn=$('bmiNote');if(!Number.isFinite(h)||h<100||h>250){bv.textContent='--';br.textContent='--';br.className='pill';bn.textContent='設定で身長を入力してください'}else{const bmi=w()/Math.pow(h/100,2);bv.textContent=bmi.toFixed(1);bn.textContent='';if(bmi<18.5){br.textContent='低め';br.className='pill low'}else if(bmi<25){br.textContent='普通';br.className='pill'}else{br.textContent='高め';br.className='pill high'}}}
function change(step){data.records[todayKey]=Math.max(20,Math.min(300,Math.round((w()+step)*10)/10));persist();renderHome();renderCalendar();draw()}
function changeGoal(step){data.goal=Math.max(20,Math.min(300,Math.round((Number(data.goal)+step)*10)/10));persist();renderHome();draw()}
function show(id){current=id;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));$('backBtn').style.display=id==='home'?'none':'block';$('head').textContent=id==='home'?'体重管理':id==='graph'?'グラフ':id==='history'?'過去の記録':id==='settings'?'設定':'体重の編集';document.querySelector('main').scrollTop=0;if(id==='home')renderHome();if(id==='graph')draw();if(id==='history')renderCalendar()}
function renderCalendar(){const y=calCursor.getFullYear(),m=calCursor.getMonth();$('calTitle').textContent=y+'年 '+(m+1)+'月';const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let html='';for(let i=0;i<first;i++)html+='<div class="day empty"></div>';for(let n=1;n<=last;n++){const d=new Date(y,m,n),k=dateKey(d),has=Number.isFinite(Number(data.records[k])),isToday=k===todayKey;html+='<button class="day '+(has?'has-record':'no-record')+(isToday?' today':'')+'" data-date="'+k+'"><span class="n">'+n+'</span><span class="wgt">'+(has?Number(data.records[k]).toFixed(1):'--')+'</span></button>'} $('calendarGrid').innerHTML=html;document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>openEdit(b.dataset.date))}
function openEdit(k){editing=k;const d=new Date(k+'T00:00:00'),has=Number.isFinite(Number(data.records[k]));$('editDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';$('editWeight').value=has?Number(data.records[k]).toFixed(1):w().toFixed(1);$('editHint').textContent=has?'この日の体重を編集できます':'記録がない日です。体重を入力して保存できます';$('deleteEdit').style.display=has?'block':'none';show('editPage')}
function fmtDate(d,year=false){return year?(d.getFullYear()+'/'+(d.getMonth()+1)):(d.getMonth()+1)+'/'+d.getDate()}
function draw(){const svg=$('chart'),start=new Date(today);start.setDate(start.getDate()-(days-1));$('periodNote').textContent=fmtDate(start,true)+' 〜 '+fmtDate(today,true);const all=Object.entries(data.records).map(([k,v])=>({d:new Date(k+'T00:00:00'),v:Number(v)})).filter(p=>p.d>=start&&p.d<=today&&Number.isFinite(p.v)).sort((a,b)=>a.d-b.d);const W=360,H=315,L=52,R=16,T=24,B=58,span=Math.max(1,today-start),xDate=d=>L+(W-L-R)*(d-start)/span;let vals=all.map(p=>p.v).concat([Number(data.goal)]);if(!all.length)vals=[Number(data.goal)-1,Number(data.goal)+1];let mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);if(mx-mn<4)mx=mn+4;const y=v=>T+(H-T-B)*(mx-v)/(mx-mn);let s='';for(let n=mn;n<=mx;n++){const yy=y(n);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#f1e9ed"/><text x="'+(L-7)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#938792">'+n+' kg</text>'}const gy=y(Number(data.goal));s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="#e27a9b" stroke-dasharray="5 5"/>';if(all.length){s+='<path d="'+all.map((p,i)=>(i?'L':'M')+' '+xDate(p.d).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ')+'" fill="none" stroke="#df5d88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';all.forEach(p=>{const xx=xDate(p.d),yy=y(p.v);s+='<circle cx="'+xx+'" cy="'+yy+'" r="4" fill="#d63f73"/>';if(days!==365)s+='<text x="'+xx+'" y="'+(yy-10)+'" text-anchor="middle" font-size="10" fill="#6e626b">'+p.v.toFixed(1)+'</text>'})}let ticks=[];if(days===7){for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);ticks.push(d)}}else if(days===30){for(let i=0;i<5;i++)ticks.push(new Date(start.getTime()+(today-start)*i/4))}else{for(let i=0;i<6;i++)ticks.push(new Date(start.getTime()+(today-start)*i/5))}ticks.forEach(d=>{const xx=xDate(d);s+='<line x1="'+xx+'" x2="'+xx+'" y1="'+(H-B)+'" y2="'+(H-B+5)+'" stroke="#cdbfc6"/><text x="'+xx+'" y="'+(H-B+21)+'" text-anchor="middle" font-size="10" fill="#81747d">'+fmtDate(d,days===365)+'</text>'});if(!all.length)s+='<text x="180" y="145" text-anchor="middle" fill="#877985">この期間の記録がありません</text>';svg.innerHTML=s}
function bindHold(id,step){const btn=$(id);let delay=null,repeat=null,active=false;const stop=()=>{active=false;clearTimeout(delay);clearInterval(repeat);delay=repeat=null};btn.addEventListener('pointerdown',e=>{e.preventDefault();stop();active=true;try{btn.setPointerCapture(e.pointerId)}catch(_){}change(step);delay=setTimeout(()=>{if(!active)return;repeat=setInterval(()=>{if(active)change(step)},125)},420)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,stop));btn.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('blur',stop)}bindHold('minus',-.1);bindHold('plus',.1);
function bindActionHold(id,action){const btn=$(id);let delay=null,repeat=null,active=false;const stop=()=>{active=false;clearTimeout(delay);clearInterval(repeat);delay=repeat=null};btn.addEventListener('pointerdown',e=>{e.preventDefault();stop();active=true;try{btn.setPointerCapture(e.pointerId)}catch(_){}action();delay=setTimeout(()=>{if(!active)return;repeat=setInterval(()=>{if(active)action()},125)},420)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,stop));btn.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('blur',stop)}bindActionHold('gminus',()=>changeGoal(-.1));bindActionHold('gplus',()=>changeGoal(.1));
$('openGraph').onclick=()=>show('graph');$('openHistory').onclick=()=>show('history');$('openSettings').onclick=()=>show('settings');$('backBtn').onclick=()=>show('home');$('prevMonth').onpointerdown=e=>e.preventDefault();$('nextMonth').onpointerdown=e=>e.preventDefault();$('prevMonth').onclick=e=>{e.preventDefault();e.currentTarget.blur();calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=e=>{e.preventDefault();e.currentTarget.blur();calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);renderCalendar()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));draw()});$('heightInput').onchange=()=>{const h=Number($('heightInput').value);data.profile.height=Number.isFinite(h)&&h>=100&&h<=250?h:null;persist();renderHome()};$('eminus').onclick=()=>{$('editWeight').value=(Math.round((Number($('editWeight').value)-.1)*10)/10).toFixed(1)};$('eplus').onclick=()=>{$('editWeight').value=(Math.round((Number($('editWeight').value)+.1)*10)/10).toFixed(1)};$('saveEdit').onclick=()=>{if(editing){const v=Number($('editWeight').value);if(Number.isFinite(v)){data.records[editing]=Math.round(v*10)/10;persist();renderHome();renderCalendar();draw();show('history')}}};$('deleteEdit').onclick=()=>{if(editing&&data.records[editing]!=null&&confirm('この記録を削除しますか？')){delete data.records[editing];persist();renderHome();renderCalendar();draw();show('history')}};persist();renderHome();renderCalendar();draw()})();
</script>
