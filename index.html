<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8f9">
  <title>Pet Care</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <button id="back" class="head-action" hidden>‹ 戻る</button>
      <h1 id="title">ホーム</h1>
      <button class="head-action" data-page="pets">ペット切替</button>
    </header>
    <main id="main"><p class="empty">画面を準備しています…</p></main>
    <nav>
      <button data-page="home"><span>⌂</span>ホーム</button>
      <button data-page="records"><span>▣</span>記録</button>
      <button data-page="schedule"><span>□</span>予定</button>
      <button data-page="health"><span>♥</span>健康</button>
      <button data-page="settings"><span>•••</span>その他</button>
    </nav>
  </div>
  <input id="importFile" type="file" accept="application/json" hidden>
  <script>
    // Handle the home meal row before the generic one-time care toggle.
    // Does not modify localStorage, prior records, or meal goals.
    document.addEventListener('click', function(event) {
      const button = event.target instanceof Element ? event.target.closest('button[data-care="ごはん"]') : null;
      if (!button) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      navigate('meal');
    }, true);
  </script>
  <script src="app.js?v=meal-repeat-20260922b"></script>
</body>
</html>
