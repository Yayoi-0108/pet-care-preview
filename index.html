<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet Care 試作版</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf6f2;color:#50494a;font-family:-apple-system,'Hiragino Sans',sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#fffdfa;padding:20px 18px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:5px 0 20px}h2{font-size:16px;margin:8px 0 13px}.card{background:white;border:1px solid #f0e4e4;border-radius:19px;padding:16px;margin:12px 0;box-shadow:0 3px 9px #f6eeee}.pet{display:flex;gap:15px;align-items:center;background:#fff1f3}.pet .face{font-size:48px}.muted,small{color:#978b90;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{border:1px solid #f5e6e8;background:#fff9fa;border-radius:15px;padding:13px 4px;font-size:24px;cursor:pointer}.tile span{display:block;font-size:11px;margin-top:5px}.tile.done{background:#e9f7ed;border-color:#c8e5ce}.pink{width:100%;border:0;border-radius:24px;background:#f5a3b5;color:white;padding:12px;font-weight:bold;margin-top:9px}.line{padding:12px 3px;border-bottom:1px solid #f3ebed;font-size:13px}.line:last-child{border:0}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:white;border-top:1px solid #f1e5e8;display:flex;justify-content:space-around;padding:11px 0}nav button{border:0;background:none;color:#b87f90;font-size:12px}.hidden{display:none}input,select,textarea{width:100%;padding:12px;border:1px solid #eadcde;border-radius:12px;margin:7px 0;font:inherit}.pill{display:inline-block;background:#fff0f3;padding:7px 11px;border-radius:20px;font-size:12px;margin:4px}
</style></head><body><div class="app"><header><h1>🐾 Pet Care</h1><span>⚙️</span></header><main id="main"></main><nav><button onclick="page('home')">🏠 ホーム</button><button onclick="page('records')">📝 記録</button><button onclick="page('schedule')">📅 予定</button><button onclick="page('family')">👨‍👩‍👧 家族</button></nav></div><script>
const key='pet-care-demo-v1';let state=JSON.parse(localStorage.getItem(key)||'{"done":[],"records":[],"events":[]}');const save=()=>localStorage.setItem(key,JSON.stringify(state));const main=document.getElementById('main');const pet='<div class="card pet"><div class="face">🐶</div><div><b>ポチ ♡</b><p class="muted">3歳・男の子　家族で見守り中</p></div></div>';function page(name){let html='';if(name==='home'){html=pet+'<div class="card"><h2>🐾 今日のお世話</h2><div class="grid">'+[['🍚','ごはん'],['🐾','散歩'],['💊','お薬'],['💩','うんち'],['🤢','嘔吐'],['⚖️','体重']].map(([e,n])=>`<button class="tile ${state.done.includes(n)?'done':''}" onclick="toggle('${n}')">${e}<span>${n} ${state.done.includes(n)?'✓':''}</span></button>`).join('')+'</div></div><div class="card"><h2>📅 次の予定</h2>'+eventLines()+'<button class="pink" onclick="page(\'schedule\')">予定を見る</button></div><div class="card"><h2>💗 健康情報</h2><div class="line">💉 予防接種</div><div class="line">✂️ トリミング</div><div class="line">🩺 病気の既往歴</div><div class="line">🏥 手術歴</div><button class="pink" onclick="page(\'health\')">健康情報を見る</button></div>'}else if(name==='records'){html=pet+'<div class="card"><h2>記録を追加</h2><select id="kind"><option>ごはん</option><option>散歩</option><option>お薬</option><option>うんち</option><option>嘔吐</option><option>体重</option><option>メモ</option></select><textarea id="note" placeholder="内容や体重などを入力"></textarea><button class="pink" onclick="addRecord()">保存する</button></div><div class="card"><h2>最近の記録</h2>'+ (state.records.map(r=>`<div class="line">${escapeHtml(r.kind)}：${escapeHtml(r.note)}<br><small>${escapeHtml(r.date)}・あなた</small></div>`).join('')||'<p class="muted">まだ記録はありません</p>')+'</div>'}else if(name==='schedule'){html='<h2>📅 予定</h2><div class="card"><select id="eventKind"><option>予防接種</option><option>トリミング</option><option>健診</option><option>お薬</option><option>その他</option></select><input id="eventDate" type="date"><input id="eventNote" placeholder="予定の内容"><button class="pink" onclick="addEvent()">予定を保存する</button><p class="muted">※前日通知は今後実装します。現在は端末への通知は届きません。</p></div><div class="card">'+eventLines()+'</div>'}else if(name==='health'){html=pet+'<h2>💗 健康情報</h2>'+['予防接種','トリミング','病気の既往歴','手術歴'].map(n=>`<div class="card"><h2>${n}</h2><p class="muted">この項目の詳細入力は次の開発段階です。</p></div>`).join('')}else if(name==='family'){html=pet+'<div class="card"><h2>👨‍👩‍👧 家族共有</h2><p>ママ（管理者）</p><p>パパ（サンプル）</p><p>お姉ちゃん（サンプル）</p><button class="pink" onclick="alert('招待・複数端末同期は未実装です。今はこの端末だけの試作です。')">＋ 家族を招待する</button><p class="muted">※家族メンバーは表示例です。実際の招待・共有はまだできません。</p></div>'}main.innerHTML=html}function eventLines(){return state.events.length?state.events.map(e=>`<div class="line">${escapeHtml(e.kind)}：${escapeHtml(e.date)}<br><small>${escapeHtml(e.note)}</small></div>`).join(''):'<p class="muted">予定はまだありません</p>'}function toggle(n){state.done=state.done.includes(n)?state.done.filter(x=>x!==n):[...state.done,n];save();page('home')}function addRecord(){state.records.unshift({kind:document.getElementById('kind').value,note:document.getElementById('note').value,date:new Date().toLocaleString('ja-JP')});save();page('records')}function addEvent(){const date=document.getElementById('eventDate').value;if(!date){alert('日付を選んでね');return}state.events.push({kind:document.getElementById('eventKind').value,date,note:document.getElementById('eventNote').value});save();page('schedule')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}page('home');
</script></body></html>
